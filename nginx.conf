# What a request without a gateway answer may have done, in the gateway's transport error shape: a read
# changed nothing, a write may have been recorded.
map $request_method $api_outcome {
    GET     unavailable;
    HEAD    unavailable;
    OPTIONS unavailable;
    default unknown;
}

# The access log keeps no client address, Referer or query string (they can identify a person).
# $umir_log_path is the path the client asked for, cut before "?"; an invitation ID stays in it.
map $request_uri $umir_log_path {
    ~^(?<path>[^?]*) $path;
    default          "";
}

# Docker's resolver, asked again after 10 s. It stands at the http level because the "resolve" of the
# upstream below reads it there; the servers and locations inherit it.
resolver 127.0.0.11 valid=10s ipv6=off;

# Live streams stay on one gateway replica (R4, C20). "gateway" is the network alias of every replica;
# it resolves to all their addresses and is looked up again as the resolver's valid time passes.
# The session cookie is read by a map: its name may start with "__Host-", and a hyphen ends the name
# of a cookie variable. The pattern is quoted because it contains ";". A request without a session
# keeps to one replica by the client address.
map $http_cookie $umir_sid {
    "~(?:^|;\s*)(?:__Host-)?umir_operator_session=(?<sid>[^;\s]+)" $sid;
    default "";
}

map $umir_sid $umir_live_key {
    ""      $remote_addr;
    default $umir_sid;
}

# Plain "hash", not "hash ... consistent": with "resolve" the consistent ring is built from the one
# configured name and never from the replicas found later, so nginx 1.30 hands the stream out
# round-robin; the plain hash picks among the resolved replicas (tests/nginx checks both).
upstream gateway_live {
    zone gateway_live 64k;
    hash $umir_live_key;
    server gateway:8080 resolve;
}

log_format umir '$time_iso8601 $request_method $umir_log_path $status $body_bytes_sent $request_time $request_id';

server {
    listen 8080;
    server_name _;
    root /usr/share/nginx/html;
    access_log /var/log/nginx/access.log umir;

    # Client address (R11, C34). This file is a template of the image: at start the entrypoint fills
    # in UMIR_TRUSTED_PROXY (the CIDR of the proxy in front, set by the deployment; the image default
    # trusts the loopback only) and leaves every other $variable alone (NGINX_ENVSUBST_FILTER=^UMIR_).
    # A request from that proxy gets its client address from the last X-Forwarded-For entry; from any
    # other peer the header is ignored. $remote_addr is the result, and gateway gets only that.
    set_real_ip_from ${UMIR_TRUSTED_PROXY};
    real_ip_header X-Forwarded-For;
    real_ip_recursive off;

    # Security headers (security-headers.conf). A location that sets its own add_header includes
    # the file again. The invitation location replaces the Referrer-Policy value.
    set $umir_referrer_policy strict-origin-when-cross-origin;
    include /etc/nginx/security-headers.conf;

    # Compression is switched on only in the static locations below. The API stays uncompressed:
    # its answers carry the CSRF token (BREACH), and the live stream must not be buffered.
    gzip_vary on;
    gzip_min_length 1024;
    gzip_types text/css application/javascript text/javascript image/svg+xml application/manifest+json;

    # API proxy (gateway#8, gateway#10). The browser's Host with its port, Origin, cookies and
    # X-CSRF-Token reach gateway unchanged, as do the raw path and query; gateway's status, body and
    # Set-Cookie come back unchanged. Nothing is cached or retried: a timeout or disconnect after
    # dispatch is an unknown outcome that the client resolves. gateway bounds each exchange by
    # UPSTREAM_TIMEOUT (15 s) and account bodies by 10 s, so keep proxy_read_timeout above both.
    set $gateway http://gateway:8080;
    proxy_set_header Host $http_host;
    proxy_set_header X-Forwarded-For $remote_addr;
    proxy_set_header Forwarded "";
    proxy_set_header X-Real-IP "";
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_connect_timeout 5s;
    proxy_send_timeout 30s;
    proxy_read_timeout 30s;
    proxy_next_upstream off;
    proxy_cache off;

    location = /healthz {
        access_log off;
        default_type text/plain;
        return 200 "ok\n";
    }

    # Readiness (C32, C42): the static files are served. It does not depend on gateway.
    location = /readyz {
        access_log off;
        default_type application/json;
        add_header Cache-Control no-store;
        include /etc/nginx/security-headers.conf;
        return 200 '{"capabilities":{"static":"ok"}}\n';
    }

    # The status addresses are exact matches; a sub-path is not the page.
    location ^~ /healthz/ {
        return 404;
    }

    location ^~ /readyz/ {
        return 404;
    }

    location /api/ {
        error_page 413 = @api_too_large;
        error_page 502 = @api_unavailable;
        error_page 504 = @api_timeout;
        proxy_pass $gateway;
    }

    # Feedback forms take at most 16 KiB (gateway#10): the public form and the
    # form inside a restaurant.
    location ~ ^/api/v2/(feedback/anonymous|r/[0-9a-f-]+/feedback)$ {
        client_max_body_size 16k;
        error_page 413 = @api_too_large;
        error_page 502 = @api_unavailable;
        error_page 504 = @api_timeout;
        proxy_pass $gateway;
    }

    # Live updates of a restaurant (SSE, backend v2). A proxy_set_header here
    # replaces the server-level list, so Host and the forwarding headers are
    # repeated. Gateway writes a heartbeat every few seconds, well inside the
    # 60 s read timeout. The stream goes to the replica its session is pinned to; it is a read
    # without side effects, so a failed connection is tried once on the other replica (a client
    # that lands on a replica that did not issue its cursor gets refresh-required).
    location ~ ^/api/v2/r/[0-9a-f-]+/live$ {
        error_page 502 = @api_unavailable;
        error_page 504 = @api_timeout;
        proxy_pass http://gateway_live;
        proxy_next_upstream error timeout;
        proxy_next_upstream_tries 2;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_set_header Host $http_host;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header Forwarded "";
        proxy_set_header X-Real-IP "";
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_buffering off;
        proxy_cache off;
        gzip off;
        proxy_read_timeout 60s;
    }

    # Nginx's own API errors use the contract's #Error shape instead of HTML
    # pages.
    location @api_too_large {
        default_type application/json;
        add_header Cache-Control no-store always;
        include /etc/nginx/security-headers.conf;
        return 413 '{"code":"PayloadTooLarge","outcome":"not_committed","message":"request body is too large","retryable":false,"requestID":"$request_id"}\n';
    }

    location @api_unavailable {
        default_type application/json;
        add_header Cache-Control no-store always;
        include /etc/nginx/security-headers.conf;
        return 502 '{"code":"UpstreamUnavailable","outcome":"$api_outcome","message":"gateway did not respond","retryable":true}\n';
    }

    location @api_timeout {
        default_type application/json;
        add_header Cache-Control no-store always;
        include /etc/nginx/security-headers.conf;
        return 504 '{"code":"UpstreamTimeout","outcome":"$api_outcome","message":"gateway did not respond in time","retryable":true}\n';
    }

    # The stock mime.types has no webmanifest entry.
    location = /manifest.webmanifest {
        default_type application/manifest+json;
        gzip on;
        add_header Cache-Control no-cache;
        include /etc/nginx/security-headers.conf;
    }

    # The page must be revalidated: a cached copy would name bundles that a newer build has removed.
    location = /index.html {
        gzip on;
        add_header Cache-Control no-cache;
        include /etc/nginx/security-headers.conf;
    }

    # Hashed bundles never change under their name. A miss is a 404, not the page; Cache-Control has
    # no "always", so the 404 is not marked immutable.
    location /assets/ {
        try_files $uri =404;
        gzip on;
        add_header Cache-Control "public, max-age=31536000, immutable";
        include /etc/nginx/security-headers.conf;
    }

    # Invitation links carry the invitation ID in the path (UI API amendment
    # UA1): no Referer leaves the page. The page is served from this location
    # (rewrite ... break): try_files would move to /index.html, which has its
    # own location.
    location /invite/ {
        set $umir_referrer_policy no-referrer;
        gzip on;
        add_header Cache-Control no-cache;
        include /etc/nginx/security-headers.conf;
        rewrite ^ /index.html break;
    }

    # Other root files (icons, favicon) and the page fallback.
    location / {
        gzip on;
        add_header Cache-Control no-cache;
        include /etc/nginx/security-headers.conf;
        try_files $uri $uri/ /index.html;
    }
}
