# What a request without a gateway answer may have done, in the gateway's transport error shape: a read
# changed nothing, a write may have been recorded.
map $request_method $api_outcome {
    GET     unavailable;
    HEAD    unavailable;
    OPTIONS unavailable;
    default unknown;
}

server {
    listen 8080;
    server_name _;
    root /usr/share/nginx/html;
    resolver 127.0.0.11 valid=10s ipv6=off;

    # API proxy (gateway#8, gateway#10). The browser's Host with its port, Origin, cookies and
    # X-CSRF-Token reach gateway unchanged, as do the raw path and query; gateway's status, body and
    # Set-Cookie come back unchanged. Nothing is cached or retried: a timeout or disconnect after
    # dispatch is an unknown outcome that the client resolves. gateway bounds each exchange by
    # UPSTREAM_TIMEOUT (15 s) and account bodies by 10 s, so keep proxy_read_timeout above both.
    set $gateway http://gateway:8080;
    proxy_set_header Host $http_host;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_connect_timeout 5s;
    proxy_send_timeout 30s;
    proxy_read_timeout 30s;
    proxy_next_upstream off;
    proxy_cache off;

    location = /healthz {
        access_log off;
        default_type text/plain;
        return 200 "ok\n";
    }

    location /api/ {
        error_page 413 = @api_too_large;
        error_page 502 = @api_unavailable;
        error_page 504 = @api_timeout;
        proxy_pass $gateway;
    }

    # The public feedback form takes at most 16 KiB (gateway#10).
    location = /api/feedback {
        client_max_body_size 16k;
        error_page 413 = @api_too_large;
        error_page 502 = @api_unavailable;
        error_page 504 = @api_timeout;
        proxy_pass $gateway;
    }

    # Live updates (SSE, factory realtime spec section 8). A proxy_set_header here
    # replaces the server-level list, so Host and the forwarding headers are
    # repeated. Gateway pings every 15 s, well inside the 60 s read timeout.
    location = /api/live {
        error_page 502 = @api_unavailable;
        error_page 504 = @api_timeout;
        proxy_pass $gateway;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_set_header Host $http_host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_buffering off;
        proxy_cache off;
        gzip off;
        proxy_read_timeout 60s;
    }

    # Nginx's own API errors use gateway's JSON shapes instead of HTML pages.
    location @api_too_large {
        default_type application/json;
        add_header Cache-Control no-store always;
        return 413 '{"code":"PayloadTooLarge","message":"request body is too large","requestID":"$request_id"}\n';
    }

    location @api_unavailable {
        default_type application/json;
        add_header Cache-Control no-store always;
        return 502 '{"code":"UpstreamUnavailable","message":"gateway did not respond","outcome":"$api_outcome"}\n';
    }

    location @api_timeout {
        default_type application/json;
        add_header Cache-Control no-store always;
        return 504 '{"code":"UpstreamTimeout","message":"gateway did not respond in time","outcome":"$api_outcome"}\n';
    }

    # The stock mime.types has no webmanifest entry.
    location = /manifest.webmanifest {
        default_type application/manifest+json;
    }

    location / {
        try_files $uri $uri/ /index.html;
    }
}
