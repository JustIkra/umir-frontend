# Security headers shared by every response (F1-3). The image keeps this file at
# /etc/nginx/security-headers.conf; nginx.conf includes it in the server and again in every
# location that sets its own add_header, because a location's add_header drops the inherited ones.
# "always" puts them on 404, 413, 502 and 504 as well. TLS ends at the proxy in front of this
# container, so there is no HSTS here.
#
# $umir_referrer_policy is set in nginx.conf: one value per response, and the invitation page
# replaces the general policy instead of adding a second header.
add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data:; font-src 'self'; connect-src 'self'; frame-src https://yandex.ru; manifest-src 'self'; object-src 'none'; base-uri 'self'; form-action 'self'; frame-ancestors 'none'" always;
add_header X-Content-Type-Options nosniff always;
add_header X-Frame-Options DENY always;
add_header Referrer-Policy $umir_referrer_policy always;
